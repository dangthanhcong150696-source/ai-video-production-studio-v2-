services:
  - type: web
    name: ai-video-production-studio-v3-preview
    branch: feature/studio-v3
    autoDeploy: false
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /app/data
      - key: STUDIO_PASSWORD
        generateValue: true
